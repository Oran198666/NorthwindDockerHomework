services:

  # mysql container
  mysql-service:

    # mysql image
    image: mysql:8

    container_name: mysql-container

    # restart policy
    restart: unless-stopped

    # port mapping (host:container)
    ports:
      - 3307:3306

    # volumes
    volumes:
      - mysql-volume:/var/lib/mysql
      - ./Database/MySQL:/docker-entrypoint-initdb.d:ro

    # environment variables needed by mysql image:
    environment:
      MYSQL_USER: orans
      MYSQL_PASSWORD: "Pa$$$$w0rd"
      MYSQL_DATABASE: northwind
      MYSQL_ROOT_PASSWORD: "Pa$$$$w0rd"

  #---------------------------------------------------------------
  # mongo container
  mongo-service:

    # mongo image
    image: mongo:8

    container_name: mongo-container

    # restart policy
    restart: unless-stopped

    # port mapping (host:container)
    ports:
      - 27017:27017

    # volumes
    volumes:
      - mongo-volume:/data/db

    # environment variables needed by mongo image:
    environment:
      MONGO_INITDB_ROOT_USERNAME: orans
      MONGO_INITDB_ROOT_PASSWORD: "Pa$$$$w0rd"
      MONGO_INITDB_DATABASE: northwind

  #---------------------------------------------------------------
  # Our backend service:
  backend-service:

    # Our image:
    image: northwind-backend

    # Build the image from the following Dockerfile location:
    build: ./Backend

    # Our container:
    container_name: northwind-backend-container

    # Port mapping (host:container):
    ports:
      - 4000:4000

    # On crash - restart container:
    restart: unless-stopped

    # volumes
    volumes:
      - assets-volume:/app/src/assets

    # Wait for the databases to start:
    depends_on:
      - mysql-service
      - mongo-service

        # Environment variables for the backend:
    environment:
      MYSQL_HOST: mysql-service
      MYSQL_USER: root
      MYSQL_PASSWORD: "Pa$$$$w0rd"
      MYSQL_DATABASE: northwind
      MONGODB_CONNECTION_STRING: "mongodb://orans:Pa$$$$w0rd@mongo-service:27017/northwind?authSource=admin"
#------------------------------------

  #---------------------------------------------------------------
  # Our frontend service:
  frontend-service:

    # Our image:
    image: northwind-frontend

    # Build the image from the following Dockerfile location:
    build: ./Frontend

    # Our container:
    container_name: northwind-frontend

    # Port mapping (host:container):
    ports:
      - 80:5173

    # On crash - restart container:
    restart: unless-stopped

    # Wait for the backend to start:
    depends_on:
      - backend-service

#------------------------------------

# List of all our named-volumes:
volumes:
  mysql-volume:
  mongo-volume:
  assets-volume: